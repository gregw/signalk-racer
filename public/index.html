<!DOCTYPE html>
<!-- public/index.html: the racer webapp's menu. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SignalK Racer</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            /* Everything is sized in em from here, so the page scales with its width:
               about 19px on a phone, 32px at 1000px, up to 48px on a large screen. */
            font-size: clamp(18px, 12px + 2vw, 48px);
            margin: 1em auto;
            padding: 0 16px;
            max-width: 900px;
            text-align: center;
        }
        h1 { font-size: 1.2em; margin: 0.5em 0 1em; }
        .menu { display: flex; flex-direction: column; gap: 0.6em; }
        .menu a {
            display: block;
            padding: 0.7em 0.5em;
            border-radius: 8px;
            background: #041b8e;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.3em;
            letter-spacing: 0.05em;
        }
        .menu a:hover, .menu a:focus { background: #2196F3; }
        .menu small { display: block; font-weight: normal; font-size: 0.5em; color: #ccd; letter-spacing: 0; margin-top: 0.2em; }
        #version { margin-top: 1.5em; font-size: 0.6em; color: #888; }
    </style>
</head>
<body>

<h1>Signal K Racer</h1>

<div class="menu">
    <a href="start.html">START<small>Start line, timer and approach</small></a>
    <a href="vmg.html">VMG<small>Best and effective VMGs, polars and adjustments</small></a>
    <a href="course.html">COURSE<small>Legs, bearings, distances and TWAs of the route</small></a>
</div>

<div id="version">signalk-racer</div>

<script>
    // The plugin reports its version with the list of lines.
    fetch('/signalk/v1/api/vessels/self/navigation/racing/lines')
        .then(res => res.ok ? res.json() : null)
        .then(data => {
            const version = data?.value?.pluginVersion;
            if (version)
                document.getElementById('version').textContent = 'signalk-racer ' + version;
        })
        .catch(() => {});
</script>
</body>
</html>
